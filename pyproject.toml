[project]
name = "research-radar"
version = "0.1.0"
description = "Tracks which methods, models, tasks and datasets rise and fade in arXiv ML papers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
radar = "research_radar.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pgserver>=0.1.4 ; (platform_machine == 'x86_64' and sys_platform == 'linux') or (platform_machine == 'AMD64' and sys_platform == 'win32') or (sys_platform != 'linux' and sys_platform != 'win32')",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
